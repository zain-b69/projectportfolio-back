services:
  postgres:
    image: postgres:16
    container_name: projectportfolio-postgres
    environment:
      POSTGRES_DB: project_portfolio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - projectportfolio_data:/var/lib/postgresql/data
volumes:
  projectportfolio_data: